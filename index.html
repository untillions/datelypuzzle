<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
	<title>Dately Puzzle</title>
	<link rel="icon" type="image/png" href="icon.png">
	<link rel="apple-touch-icon" href="icon.png">
	<link rel="manifest" href="manifest.webmanifest">
	<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
	<style>
		:root {
			--bg: #eef1f4;
			--ink: #1b2430;
			--mut: #5d6b7a;
			--board: #2b3340;
			--cell: #3a4555;
			--hole: #eef1f4;
			--line: #c4ccd6;
			--btn: #1b2430;
			--btnink: #fff;
			--win: #1f9d55;
			box-sizing: border-box;
			padding-top: env(safe-area-inset-top, 0px);
			padding-bottom: env(safe-area-inset-bottom, 0px);
		}

		@media (prefers-color-scheme: dark) {
			:root:not([data-theme="light"]) {
				--bg: #12161c;
				--ink: #e8edf2;
				--mut: #93a1b0;
				--board: #222a35;
				--cell: #2e3846;
				--hole: #12161c;
				--line: #33404f;
				--btn: #e8edf2;
				--btnink: #12161c;
			}
		}

		:root[data-theme="dark"] {
			--bg: #12161c;
			--ink: #e8edf2;
			--mut: #93a1b0;
			--board: #222a35;
			--cell: #2e3846;
			--hole: #12161c;
			--line: #33404f;
			--btn: #e8edf2;
			--btnink: #12161c;
		}

		* {
			box-sizing: border-box;
		}

		html, body {
			margin: 0;
			height: 100%;
			overflow: hidden;
			overscroll-behavior: none;
			touch-action: manipulation;
		}

		body {
			background: var(--bg);
			color: var(--ink);
			font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
		}

		.app {
			max-width: 1000px;
			margin: 0 auto;
			padding: 10px 12px;
			display: grid;
			gap: 10px;
		}

		/* ---- Header ---- */
		header {
			display: flex;
			flex-wrap: nowrap;
			align-items: center;
			justify-content: space-between;
			gap: 8px;
		}

		h1 {
			margin: 0;
			font-size: clamp(1.6rem, 5.5vw, 2rem);
			font-weight: 800;
			letter-spacing: -.02em;
			line-height: 1.1;
		}

		header p {
			margin: 2px 0 0;
			color: var(--mut);
			font-size: 1rem;
			white-space: nowrap;
		}

		input[type=date] {
			font-family: inherit;
			font-size: .85rem;
			color: var(--ink);
			background: transparent;
			border: 2px solid var(--line);
			border-radius: 8px;
			padding: 4px 6px;
			min-width: 0;
			max-width: 150px;
		}

		/* ---- Board ---- */
		.board {
			display: grid;
			grid-template-columns: repeat(7, 1fr);
			gap: 3px;
			background: var(--board);
			padding: 8px;
			border-radius: 12px;
			width: min(100%, 520px, calc(100dvh - 360px));
			aspect-ratio: 1;
			margin: 0 auto;
		}

		.board button {
			aspect-ratio: 1;
			border: 0;
			border-radius: 6px;
			background: var(--cell);
			color: #9fb0c3;
			font-weight: 600;
			font-size: clamp(.6rem, 2.7vw, .85rem);
			line-height: 1;
			font-family: inherit;
			padding: 0;
			cursor: pointer;
		}

		.board .off {
			visibility: hidden;
		}

		.board {
			touch-action: none;
			user-select: none;
			-webkit-user-select: none;
			-webkit-touch-callout: none;
		}

		.fly {
			position: fixed;
			left: 0;
			top: 0;
			pointer-events: none;
			z-index: 50;
			opacity: .92;
		}

		.fly i {
			position: absolute;
			border-radius: 6px;
			box-shadow: 0 4px 10px rgba(0, 0, 0, .35);
		}

		body.dragging {
			cursor: grabbing;
		}

		.help {
			margin: 0;
			color: var(--mut);
			font-size: .9rem;
		}

		.board .tgt {
			background: var(--hole);
			color: var(--ink);
			font-weight: 800;
			outline: 2px dashed var(--mut);
			outline-offset: -3px;
			cursor: default;
		}

		.board .on {
			color: #fff;
			cursor: grab;
			transition: color .5s ease;
		}

		.board .given {
			box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .75);
			cursor: default;
		}

		.board .ok {
			outline: 3px solid #7ddc9a;
			outline-offset: -3px;
			filter: brightness(1.25);
		}

		.board .bad {
			outline: 3px solid #ff7b7b;
			outline-offset: -3px;
		}

		/* ---- Message line ---- */
		#msg {
			height: 2.5em;
			margin: 10px 0 0;
			color: var(--mut);
			font-size: .88rem;
			line-height: 1.3;
			text-align: center;
		}

		#msg.win {
			color: var(--win);
		}

		#msg.warn {
			color: #d96b00;
		}

		#msg.info {
			color: #3b82c4;
		}

		#msg.clear {
			color: #e5484d;
		}

		/* ---- Buttons and actions ---- */
		.side {
			display: grid;
			gap: 14px;
			align-content: start;
		}

		.seg, .row {
			display: flex;
			flex-wrap: nowrap;
			justify-content: center;
			gap: 8px;
		}

		.modes {
			margin: 0 auto;
			width: 100%;
		}

		.actions {
			order: 2;
			justify-content: space-between;
			align-items: center;
		}

		.action-btns {
			display: flex;
			flex-wrap: nowrap;
			gap: 8px;
		}

		button.b {
			font-family: inherit;
			font-weight: 600;
			font-size: .8rem;
			border: 2px solid var(--btn);
			background: transparent;
			color: var(--ink);
			border-radius: 8px;
			padding: 9px 14px;
			white-space: nowrap;
			cursor: pointer;
		}

		button.b.danger {
			border-color: #e5484d;
			color: #e5484d;
		}

		button.b[aria-pressed=true], button.b.pri {
			background: var(--btn);
			color: var(--btnink);
		}

		button.b:disabled {
			opacity: .4;
			cursor: not-allowed;
		}

		/* ---- Timer ---- */
		#timer {
			font-size: 1.4rem;
			font-weight: 800;
			font-variant-numeric: tabular-nums;
			letter-spacing: .02em;
			text-align: left;
			color: var(--ink);
		}

		#timer.done {
			color: var(--win);
		}

		/* ---- Start screen ---- */
		.start {
			position: fixed;
			inset: 0;
			z-index: 60;
			display: grid;
			place-content: center;
			justify-items: center;
			gap: 20px;
			padding: 24px;
			background: var(--bg);
			text-align: center;
		}

		.start[hidden] {
			display: none;
		}

		.start h2 {
			margin: 0;
			font-size: clamp(1.5rem, 6vw, 2.2rem);
			font-weight: 800;
			letter-spacing: -.02em;
			line-height: 1.2;
		}

		.start .b {
			font-size: 1.1rem;
			padding: 12px 32px;
		}

		/* ---- Tile tray ---- */
		/* The tray always reserves room for two rows of tiles (tile height is 4 cells + 2px gaps + 6px padding + 2px border, each side), so the Hint and Clear row below it never shifts up as tiles leave */
		.tray {
			--t: clamp(10px, min(3.4vw, 2dvh), 20px);
			display: flex;
			flex-wrap: wrap;
			align-content: flex-start;
			gap: 8px;
			justify-content: center;
			min-height: calc(8 * var(--t) + 52px);
		}

		.tile {
			border: 2px solid var(--line);
			background: transparent;
			border-radius: 10px;
			padding: 6px;
			cursor: grab;
			touch-action: none;
			user-select: none;
			-webkit-user-select: none;
			-webkit-touch-callout: none;
		}

		.tile .g {
			display: grid;
			grid-template-columns: repeat(4, var(--t));
			grid-template-rows: repeat(4, var(--t));
			gap: 2px;
		}

		.tile[aria-pressed=true] {
			border-color: var(--ink);
		}

		.tile i {
			border-radius: 4px;
			display: block;
		}

		.empty {
			color: var(--mut);
			align-self: center;
		}

		button:focus-visible, input:focus-visible {
			outline: 3px solid #4c9aff;
			outline-offset: 2px;
		}

		/* ---- Win celebration ---- */
		/* Tiles hide their labels and do a quick diagonal wave across the board */
		.board.celebrating .on {
			color: transparent;
			animation: cheer .6s ease both;
			animation-delay: var(--d, 0s);
		}

		@keyframes cheer {
			0% {
				transform: scale(1);
			}

			40% {
				transform: scale(1.2);
			}

			100% {
				transform: scale(1);
			}
		}

		/* While the dialog is open the tiles live in the dialog, so the board shows empty cells */
		.board.lifted .on {
			background: var(--cell) !important;
			box-shadow: none;
			animation: none;
		}

		.confetti {
			position: fixed;
			inset: 0;
			width: 100%;
			height: 100%;
			pointer-events: none;
			z-index: 90;
		}

		/* ---- Win dialog ---- */
		.win-layer {
			position: fixed;
			inset: 0;
			z-index: 70;
			display: grid;
			place-items: center;
			padding: 16px;
		}

		.win-layer[hidden] {
			display: none;
		}

		.win-backdrop {
			position: absolute;
			inset: 0;
			background: var(--bg);
			-webkit-backdrop-filter: blur(3px);
			backdrop-filter: blur(3px);
			opacity: 0;
			transition: opacity .6s ease;
		}

		.win-layer.show .win-backdrop {
			opacity: .9;
		}

		.win-card {
			--u: min(calc((100vw - 96px) / 7), calc((100dvh - 200px) / 7), 62px);
			position: relative;
			isolation: isolate;
			display: grid;
			justify-items: center;
			gap: 14px;
			padding: 18px 16px 16px;
		}

		/* The card surface fades in behind the tiles as they arrive */
		.win-card::before {
			content: "";
			position: absolute;
			inset: 0;
			z-index: -1;
			border-radius: 18px;
			background: var(--board);
			box-shadow: 0 18px 50px rgba(0, 0, 0, .35);
			opacity: 0;
			transition: opacity .5s ease;
		}

		.win-layer.show .win-card::before {
			opacity: 1;
		}

		.win-card h2 {
			margin: 0;
			color: #fff;
			font-size: clamp(1.4rem, 6vw, 1.9rem);
			font-weight: 800;
			letter-spacing: -.02em;
			line-height: 1.1;
			text-align: center;
		}

		.win-grid {
			display: grid;
			grid-template-columns: repeat(7, var(--u));
			grid-template-rows: repeat(7, var(--u));
			gap: 3px;
		}

		.win-piece {
			display: grid;
			gap: 3px;
			pointer-events: none;
			will-change: transform;
		}

		.win-piece i {
			display: block;
			border-radius: 6px;
		}

		.win-piece i.given {
			box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .75);
		}

		.win-stat, .win-date {
			display: grid;
			place-content: center;
			border-radius: 6px;
			background: var(--hole);
			color: var(--ink);
			text-align: center;
		}

		.win-stat {
			gap: 2px;
			line-height: 1.1;
		}

		.win-stat small {
			display: block;
			color: var(--mut);
			font-size: max(9px, calc(var(--u) * .24));
			font-weight: 600;
		}

		.win-stat b {
			display: block;
			font-size: calc(var(--u) * .46);
			font-weight: 800;
			font-variant-numeric: tabular-nums;
		}

		.win-date {
			outline: 2px dashed var(--mut);
			outline-offset: -3px;
			font-size: max(9px, calc(var(--u) * .26));
			font-weight: 800;
		}

		.win-card .win-close {
			border-color: rgba(255, 255, 255, .6);
			color: #fff;
			font-size: .8rem;
			padding: 6px 20px;
		}

		/* Text and stats fade in once the tiles are nearly home; they fade out right away on close */
		.win-card h2, .win-stat, .win-date, .win-close {
			opacity: 0;
			transition: opacity .4s ease;
		}

		.win-layer.show h2, .win-layer.show .win-stat, .win-layer.show .win-date, .win-layer.show .win-close {
			opacity: 1;
			transition-delay: .8s;
		}

		/* ---- Wide screens ---- */
		@media (min-width: 860px) {
			.app {
				grid-template-columns: minmax(0, 520px) 1fr;
				column-gap: 36px;
			}

			header, .modes {
				grid-column: 1 / -1;
			}

			.modes {
				margin: 0;
			}

			.board {
				width: min(100%, 520px, calc(100dvh - 250px));
			}

			.tray {
				justify-content: flex-start;
			}
		}

		/* ---- Landscape phones ---- */
		@media (orientation: landscape) and (max-height: 500px) {
			body::before {
				content: "Please rotate your phone to portrait";
				position: fixed;
				inset: 0;
				z-index: 100;
				display: grid;
				place-items: center;
				text-align: center;
				padding: 24px;
				background: var(--bg);
				color: var(--ink);
				font-size: 1.2rem;
				font-weight: 600;
			}
		}
	</style>
</head>
<body>
	<div class="app">
		<header>
			<div>
				<h1>Dately Puzzle 🧩</h1>
				<p id="sub"></p>
			</div>
			<label>
				<input type="date" id="dt" aria-label="Puzzle date">
			</label>
		</header>

		<div class="seg modes" role="group" aria-label="Difficulty">
			<button class="b" data-mode="fixed" aria-pressed="false">Normal Mode 🟢</button>
			<button class="b" data-mode="free" aria-pressed="true">Hard Mode 🔴</button>
		</div>

		<section>
			<div id="board" class="board"></div>
			<p id="msg" aria-live="polite"></p>
		</section>

		<section class="side">
			<div class="seg actions" role="group" aria-label="Actions">
				<div id="timer" role="timer" aria-label="Time elapsed">00:00</div>
				<div class="action-btns">
					<button class="b" id="hint">Hint 💡</button>
					<button class="b danger" id="reset">Clear</button>
				</div>
			</div>

			<div id="tray" class="tray"></div>
		</section>
	</div>

	<!-- Start screen: hides the puzzle until the player is ready -->
	<div id="start" class="start" role="dialog" aria-modal="true" aria-labelledby="start-title">
		<h2 id="start-title">Ready to solve today's puzzle?</h2>
		<button class="b pri" id="go">Let's Go!</button>
	</div>

	<!-- Win dialog: the solved tiles rearrange into a shareable stats card (the solution is not shown) -->
	<div id="win" class="win-layer" hidden>
		<div class="win-backdrop"></div>
		<div class="win-card" role="dialog" aria-modal="true" aria-labelledby="win-title">
			<h2 id="win-title"></h2>
			<div id="win-grid" class="win-grid"></div>
			<button class="b win-close" id="win-close">Close</button>
		</div>
	</div>

	<script>
		// ---- Pieces (edit here if your physical set differs) ----
		const P = {
			L: [[0, 0], [1, 0], [2, 0], [3, 0], [3, 1]],
			N: [[0, 1], [1, 1], [1, 0], [2, 0], [3, 0]],
			P: [[0, 0], [0, 1], [1, 0], [1, 1], [2, 0]],
			U: [[0, 0], [0, 2], [1, 0], [1, 1], [1, 2]],
			V: [[0, 0], [1, 0], [2, 0], [2, 1], [2, 2]],
			Z: [[0, 0], [0, 1], [1, 1], [2, 1], [2, 2]],
			R: [[0, 0], [0, 1], [0, 2], [1, 0], [1, 1], [1, 2]],
			Y: [[0, 1], [1, 0], [1, 1], [2, 1], [3, 1]]
		};
		const COL = {
			L: '#e4572e',
			N: '#d9962b',
			P: '#4f9d69',
			U: '#2e86ab',
			V: '#7b5ea7',
			Z: '#d65a8a',
			R: '#4a6fa5',
			Y: '#8f9a22'
		};
		const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
		const $ = s => document.querySelector(s);
		const pad = n => String(n).padStart(2, '0');

		// ---- Geometry ----
		const norm = c => {
			const a = Math.min(...c.map(p => p[0]));
			const b = Math.min(...c.map(p => p[1]));
			return c.map(([x, y]) => [x - a, y - b]).sort((p, q) => p[0] - q[0] || p[1] - q[1]);
		};
		const rot = c => norm(c.map(([x, y]) => [y, -x]));
		const flip = c => norm(c.map(([x, y]) => [x, -y]));

		// Steps through all rotations and mirror images of the selected tile
		const cycle = sh => {
			const L = OR[S.sel];
			const i = L.findIndex(o => o.join(';') == sh.join(';'));
			return L[(i + 1) % L.length];
		};

		function orients(c) {
			const s = new Map();
			let a = norm(c);
			for (let f = 0; f < 2; f++) {
				for (let r = 0; r < 4; r++) {
					a = rot(a);
					s.set(a.join(';'), a);
				}
				a = flip(a);
			}
			return [...s.values()];
		}

		const OR = Object.fromEntries(Object.entries(P).map(([k, v]) => [k, orients(v)]));

		// ---- Board: 7x7, months in rows 0-1 (6 wide), days after ----
		const CELLS = [];
		for (let r = 0; r < 7; r++) {
			for (let c = 0; c < 7; c++) {
				let l = null;
				if (r < 2 && c < 6) {
					l = { t: 'm', v: r * 6 + c };
				} else if (r >= 2 && r < 6) {
					l = { t: 'd', v: (r - 2) * 7 + c + 1 };
				} else if (r == 6 && c < 3) {
					l = { t: 'd', v: 29 + c };
				}
				CELLS.push({ id: r * 7 + c, r, c, l });
			}
		}
		const REAL = CELLS.filter(x => x.l);
		const isTgt = x => x.l && ((x.l.t == 'm' && x.l.v == S.date[0]) || (x.l.t == 'd' && x.l.v == S.date[1]));

		// ---- Solver: works for any month/day ----
		function solve(m, d) {
			const free = new Set(REAL.filter(x => !((x.l.t == 'm' && x.l.v == m) || (x.l.t == 'd' && x.l.v == d))).map(x => x.id));
			const order = REAL.map(x => x.id);

			function rec(rem, out) {
				if (!rem.length) {
					return out;
				}
				const t = order.find(i => free.has(i));
				const tr = Math.floor(t / 7);
				const tc = t % 7;
				for (const id of rem) {
					for (const o of OR[id]) {
						const [a, b] = o[0];
						const ids = o.map(([x, y]) => {
							const r = tr + x - a;
							const c = tc + y - b;
							return (c < 0 || c > 6 || r < 0 || r > 6) ? -1 : r * 7 + c;
						});
						if (ids.every(i => free.has(i))) {
							ids.forEach(i => free.delete(i));
							const res = rec(rem.filter(k => k != id), [...out, { id, cells: ids }]);
							if (res) {
								return res;
							}
							ids.forEach(i => free.add(i));
						}
					}
				}
				return null;
			}

			return rec(Object.keys(P), []);
		}

		// ---- State ----
		const S = { date: [0, 1], sol: null, placed: {}, shape: {}, sel: null, mode: 'fixed', hover: null, hints: 0 };
		let drag = null;
		const toShape = ids => norm(ids.map(i => [Math.floor(i / 7), i % 7]));
		const unplaced = () => Object.keys(P).filter(k => !S.placed[k]);

		function snap() {
			if (S.sol) {
				for (const s of S.sol) {
					if (!S.placed[s.id]) {
						S.shape[s.id] = toShape(s.cells);
					}
				}
			}
		}

		function load(str) {
			const [y, m, d] = str.split('-').map(Number);
			S.date = [m - 1, d];
			S.sol = solve(m - 1, d);
			const dt = new Date(y, m - 1, d);
			$('#sub').textContent = dt.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
			clear();
			if (T.began) {
				startTimer();
			}
		}

		function clear() {
			S.placed = {};
			for (const k in P) {
				S.shape[k] = norm(P[k]);
			}
			if (S.mode == 'fixed') {
				snap();
			}
			S.sel = unplaced()[0];
			msg('');
			render();
		}

		// ---- Timer ----
		// began: the player has pressed "Let's Go!". id: the running interval (null when stopped or solved).
		const T = { began: false, t0: 0, id: null };

		function fmt(ms) {
			const s = Math.floor(ms / 1000);
			return pad(Math.floor(s / 60)) + ':' + pad(s % 60);
		}

		function tick() {
			$('#timer').textContent = fmt(Date.now() - T.t0);
		}

		function stopTimer() {
			clearInterval(T.id);
			T.id = null;
		}

		// Starts (or restarts) the timer from 00:00; a new attempt also resets the hint count
		function startTimer() {
			stopTimer();
			S.hints = 0;
			T.t0 = Date.now();
			$('#timer').classList.remove('done');
			tick();
			T.id = setInterval(tick, 250);
		}

		// Called when the puzzle is solved: freezes the time and turns it green.
		// Returns true only the first time per attempt, so the celebration doesn't repeat if a solved tile is moved and put back.
		function finishTimer() {
			if (!T.id) {
				return false;
			}
			tick();
			stopTimer();
			$('#timer').classList.add('done');
			return true;
		}

		// ---- Messages ----
		let mt;
		const HELP = () => 'Drag tiles onto the board to solve.<br>' + (S.mode == 'free' ? 'Tap a tile to rotate or flip it.' : 'Tiles have already been oriented for you.');

		// msg('') shows the help text; msg(text) shows an orange warning for 3s; msg(text,true) shows the green win message
		function msg(t, win) {
			clearTimeout(mt);
			const e = $('#msg');
			if (!t) {
				e.innerHTML = HELP();
				e.className = '';
				return;
			}
			if (win === true) {
				e.textContent = '🎉 ' + t;
				e.className = 'win';
				return;
			}
			if (win === 'info' || win === 'clear') {
				e.textContent = t;
				e.className = win;
				mt = setTimeout(() => msg(''), 3000);
				return;
			}
			e.textContent = '⚠️ ' + t;
			e.className = 'warn';
			mt = setTimeout(() => msg(''), 3000);
		}

		// ---- Tile placement helpers ----
		function anchor(sh) {
			const cx = sh.reduce((a, p) => a + p[0], 0) / sh.length;
			const cy = sh.reduce((a, p) => a + p[1], 0) / sh.length;
			return sh.reduce((b, p) => Math.hypot(p[0] - cx, p[1] - cy) < Math.hypot(b[0] - cx, b[1] - cy) ? p : b);
		}

		function footprint(id, r, c) {
			const sh = S.shape[id];
			const [a, b] = anchor(sh);
			return sh.map(([x, y]) => [r + x - a, c + y - b]);
		}

		function occMap() {
			const o = {};
			for (const [k, v] of Object.entries(S.placed)) {
				v.cells.forEach(i => o[i] = k);
			}
			return o;
		}

		function fits(fp, o) {
			return fp.every(([r, c]) => {
				if (r < 0 || r > 6 || c < 0 || c > 6) {
					return false;
				}
				const x = CELLS[r * 7 + c];
				return x.l && !isTgt(x) && o[x.id] === undefined;
			});
		}

		// ---- Rendering ----
		function render() {
			const o = occMap();
			$('#board').innerHTML = CELLS.map(x => {
				if (!x.l) {
					return `<button class="off" tabindex="-1" aria-hidden="true"></button>`;
				}
				const lab = x.l.t == 'm' ? MONTHS[x.l.v] : x.l.v;
				let cls = '';
				let st = '';
				if (isTgt(x)) {
					cls = 'tgt';
				} else if (o[x.id]) {
					cls = 'on' + (S.placed[o[x.id]].given ? ' given' : '');
					st = `background:${COL[o[x.id]]}`;
				}

				return `<button data-id="${x.id}" class="${cls}" style="${st}" aria-label="${lab}">${lab}</button>`;
			}).join('');

			const un = unplaced();
			$('#tray').innerHTML = un.length ? un.map(k => {
				const sh = S.shape[k];
				const h = Math.max(...sh.map(p => p[0])) + 1;
				const w = Math.max(...sh.map(p => p[1])) + 1;
				const ox = Math.floor((4 - w) / 2);
				const oy = Math.floor((4 - h) / 2);
				const dim = drag && drag.started && drag.k === k;
				return `<button class="tile" data-k="${k}" aria-pressed="${k === S.sel}" aria-label="Tile ${k}" style="${dim ? 'opacity:.3' : ''}"><div class="g">${
					sh.map(([x, y]) => `<i style="grid-row:${x + oy + 1};grid-column:${y + ox + 1};background:${COL[k]}"></i>`).join('')}</div></button>`;
			}).join('') : '<span class="empty">All tiles are on the board.</span>';

			document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode == S.mode));
			paintGhost();
		}

		// ---- Actions ----
		function place(r, c) {
			if (!S.sel) {
				return;
			}
			const fp = footprint(S.sel, r, c);
			if (!fits(fp, occMap())) {
				msg("That tile doesn't fit there.");
				return render();
			}
			S.placed[S.sel] = { cells: fp.map(([a, b]) => a * 7 + b) };
			S.sel = unplaced()[0];
			S.hover = null;
			let won = false;
			if (!S.sel) {
				won = finishTimer();
				msg('Solved! Every tile fits.', true);
			} else {
				msg('');
			}
			render();
			if (won) {
				celebrate();
			}
		}

		function hint() {
			if (!S.sol) {
				return msg('No solution found for this date.');
			}
			const same = (a, b) => [...a].sort().join() == [...b].sort().join();
			const left = S.sol.filter(s => !(S.placed[s.id] && same(S.placed[s.id].cells, s.cells)));
			if (!left.length) {
				return msg('Every tile is already in its correct spot.');
			}
			const s = left[Math.floor(Math.random() * left.length)];
			const cs = new Set(s.cells);
			for (const [k, v] of Object.entries(S.placed)) {
				if (k == s.id || v.cells.some(i => cs.has(i))) {
					delete S.placed[k];
				}
			}
			S.placed[s.id] = { cells: s.cells, given: true };
			S.hints++;
			S.shape[s.id] = toShape(s.cells);
			if (!S.sel || S.placed[S.sel]) {
				S.sel = unplaced()[0];
			}
			let won = false;
			if (!unplaced().length) {
				won = finishTimer();
				msg('Solved with hints! Tap Clear to try again.', true);
			} else {
				msg('💡 Hint used: one tile placed for you.', 'info');
			}
			render();
			if (won) {
				celebrate();
			}
		}

		function turn(fn) {
			if (S.mode == 'fixed' || !S.sel) {
				return;
			}
			S.shape[S.sel] = fn(S.shape[S.sel]);
			if (drag && drag.started) {
				drag.fly.remove();
				makeFly(S.sel);
				moveFly();
			}
			render();
		}

		// ---- Win celebration and dialog ----
		// Layouts the tiles rearrange into (7x7). One is used per day, cycling, so everyone who plays the same date gets the same screenshot.
		// Uppercase letters are the tiles plus the stat cells (T = Time, M = Mode, H = Hints, two cells wide each).
		// Lowercase m and d are the month and day cells. Every tile must appear exactly once in each layout.
		const WIN_MAPS = [
			[
				'mRRRTTY',
				'LRRRPYY',
				'LLLLPPY',
				'MMNNPPY',
				'NNNVVVZ',
				'UUUVZZZ',
				'UdUVZHH'
			],
			[
				'mPPZVVV',
				'PPPZZZV',
				'RRRHHZV',
				'RRRYYYY',
				'LLLLYMM',
				'NNNLUUU',
				'TTNNUdU'
			],
			[
				'UUULLLL',
				'UmUNMML',
				'VVVNNRR',
				'VZTTNRR',
				'VZZZNRR',
				'HHYZPPP',
				'YYYYdPP'
			]
		];

		// Picks the layout from the puzzle's date (days since 1970, so consecutive days always differ)
		function winMap() {
			const [y, m, d] = $('#dt').value.split('-').map(Number);
			return WIN_MAPS[Math.floor(Date.UTC(y, m - 1, d) / 86400000) % WIN_MAPS.length];
		}

		const WIN = { open: false, busy: false, pieces: [] };
		const IDENT = 'translate(0px,0px) rotate(0deg) scale(1,1)';

		function bbox(cs) {
			const r0 = Math.min(...cs.map(p => p[0]));
			const r1 = Math.max(...cs.map(p => p[0]));
			const c0 = Math.min(...cs.map(p => p[1]));
			const c1 = Math.max(...cs.map(p => p[1]));
			return { r0, r1, c0, c1, h: r1 - r0 + 1, w: c1 - c0 + 1 };
		}

		// Finds the mirror (m) and quarter-turn (deg) that turn a tile's dialog shape (B) into the way it sits on the board (A).
		// Cells are compared as doubled offsets from each bounding-box center so everything stays whole numbers.
		function matchTurn(A, B) {
			const off = cs => {
				const b = bbox(cs);
				return cs.map(([r, c]) => [2 * c - (b.c0 + b.c1), 2 * r - (b.r0 + b.r1)]);
			};
			const key = v => v.map(p => p.join(',')).sort().join(';');
			const want = key(off(A));
			const base = off(B);
			let best = null;
			for (const m of [1, -1]) {
				for (const deg of [0, 90, 180, -90]) {
					const cos = Math.round(Math.cos(deg * Math.PI / 180));
					const sin = Math.round(Math.sin(deg * Math.PI / 180));
					const v = base.map(([x, y]) => {
						const mx = x * m;
						return [mx * cos - y * sin, mx * sin + y * cos];
					});
					const cost = Math.abs(deg) + (m < 0 ? 60 : 0);
					if (key(v) == want && (!best || cost < best.cost)) {
						best = { m, deg, cost };
					}
				}
			}
			return best || { m: 1, deg: 0 };
		}

		// Fills the dialog grid: the stat cells, the month/day cells, and one block per tile laid out in its new spot
		function winBuild() {
			const lay = {};
			winMap().forEach((row, r) => [...row].forEach((ch, c) => (lay[ch] = lay[ch] || []).push([r, c])));
			const grid = $('#win-grid');
			grid.innerHTML = '';
			$('#win-title').textContent = 'Solved! 🎉';

			const stats = {
				T: ['Time', $('#timer').textContent],
				M: ['Mode', S.mode == 'free' ? 'Hard' : 'Normal'],
				H: ['Hints Used', String(S.hints)]
			};
			for (const k in stats) {
				const [r, c] = lay[k][0];
				const el = document.createElement('div');
				el.className = 'win-stat';
				el.style.gridRow = r + 1;
				el.style.gridColumn = `${c + 1} / span 2`;
				el.innerHTML = `<small>${stats[k][0]}</small><b>${stats[k][1]}</b>`;
				grid.appendChild(el);
			}

			[['m', MONTHS[S.date[0]]], ['d', S.date[1]]].forEach(([k, label]) => {
				const [r, c] = lay[k][0];
				const el = document.createElement('div');
				el.className = 'win-date';
				el.style.gridRow = r + 1;
				el.style.gridColumn = c + 1;
				el.textContent = label;
				grid.appendChild(el);
			});

			WIN.pieces = Object.keys(P).map(k => {
				const B = lay[k];
				const A = S.placed[k].cells.map(i => [Math.floor(i / 7), i % 7]);
				const b = bbox(B);
				const el = document.createElement('div');
				el.className = 'win-piece';
				el.style.gridRow = `${b.r0 + 1} / span ${b.h}`;
				el.style.gridColumn = `${b.c0 + 1} / span ${b.w}`;
				el.style.gridTemplateColumns = `repeat(${b.w}, 1fr)`;
				el.style.gridTemplateRows = `repeat(${b.h}, 1fr)`;
				const cls = S.placed[k].given ? 'given' : '';
				el.innerHTML = B.map(([r, c]) => `<i class="${cls}" style="grid-row:${r - b.r0 + 1};grid-column:${c - b.c0 + 1};background:${COL[k]}"></i>`).join('');
				grid.appendChild(el);
				return { k, A, el, turn: matchTurn(A, B) };
			});
		}

		// Measures the board and the dialog and works out, for every tile, the transform that puts its dialog block exactly over its spot on the board
		function winPose() {
			const cells = $('#board').children;
			const pb = cells[1].getBoundingClientRect().left - cells[0].getBoundingClientRect().left;
			const pd = ($('#win-grid').getBoundingClientRect().width - 18) / 7 + 3;
			const k = pb / pd;
			const poses = WIN.pieces.map(p => {
				let l = Infinity;
				let t = Infinity;
				let r = -Infinity;
				let b = -Infinity;
				for (const [row, col] of p.A) {
					const q = cells[row * 7 + col].getBoundingClientRect();
					l = Math.min(l, q.left);
					t = Math.min(t, q.top);
					r = Math.max(r, q.right);
					b = Math.max(b, q.bottom);
				}
				const d = p.el.getBoundingClientRect();
				const dx = ((l + r) - (d.left + d.right)) / 2;
				const dy = ((t + b) - (d.top + d.bottom)) / 2;
				const { m, deg } = p.turn;
				const from = `translate(${dx}px,${dy}px) rotate(${deg}deg) scale(${m * k},${k})`;
				const mid = `translate(${dx / 2}px,${dy / 2}px) rotate(${deg / 2}deg) scale(${(m * k + 1) / 2 * 1.12},${(k + 1) / 2 * 1.12})`;
				return { el: p.el, from, mid, y: t, x: l };
			});
			// Tiles set off in reading order across the board
			return poses.sort((a, b) => a.y - b.y || a.x - b.x);
		}

		// Confetti burst from both lower corners
		function confetti() {
			const dpr = Math.min(window.devicePixelRatio || 1, 2);
			const W = innerWidth;
			const H = innerHeight;
			const cv = document.createElement('canvas');
			cv.className = 'confetti';
			cv.width = W * dpr;
			cv.height = H * dpr;
			document.body.appendChild(cv);
			const g = cv.getContext('2d');
			g.scale(dpr, dpr);
			const cols = Object.values(COL).concat(['#ffd23f', '#ffffff']);
			const bits = [];
			const burst = (x, dir, n, wait) => {
				for (let i = 0; i < n; i++) {
					const a = dir * (0.15 + Math.random() * 0.75);
					const sp = (10 + Math.random() * 10) * Math.max(0.7, Math.min(H / 800, 1.2));
					bits.push({
						x, y: H * 0.8,
						vx: Math.sin(a) * sp, vy: -Math.cos(a) * sp,
						w: 6 + Math.random() * 6, h: 3 + Math.random() * 4,
						rot: Math.random() * 6.28, vr: (Math.random() - .5) * .4,
						ph: Math.random() * 6.28,
						col: cols[Math.floor(Math.random() * cols.length)],
						t0: wait + Math.random() * 120,
						life: 2200 + Math.random() * 1200
					});
				}
			};
			burst(W * 0.1, 1, 90, 0);
			burst(W * 0.9, -1, 90, 0);
			burst(W * 0.1, 1, 60, 350);
			burst(W * 0.9, -1, 60, 350);
			const start = performance.now();
			let last = start;
			(function frame(now) {
				const dt = Math.min((now - last) / 16.667, 3);
				last = now;
				const t = now - start;
				g.clearRect(0, 0, W, H);
				let alive = false;
				for (const b of bits) {
					if (t < b.t0) {
						alive = true;
						continue;
					}
					const age = t - b.t0;
					if (age > b.life) {
						continue;
					}
					alive = true;
					b.vx *= Math.pow(0.965, dt);
					b.vy = b.vy * Math.pow(0.965, dt) + 0.22 * dt;
					b.x += b.vx * dt;
					b.y += b.vy * dt;
					b.rot += b.vr * dt;
					b.ph += 0.2 * dt;
					g.globalAlpha = Math.min(1, (b.life - age) / 500);
					g.save();
					g.translate(b.x, b.y);
					g.rotate(b.rot);
					g.scale(1, Math.cos(b.ph));
					g.fillStyle = b.col;
					g.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
					g.restore();
				}
				if (alive) {
					requestAnimationFrame(frame);
				} else {
					cv.remove();
				}
			})(start);
		}

		// Win sequence: confetti and a wave across the board, then the tiles fly into the dialog
		function celebrate() {
			if (WIN.open) {
				return;
			}
			WIN.open = true;
			WIN.busy = true;
			$('.app').inert = true;
			const board = $('#board');
			board.classList.add('celebrating');
			board.querySelectorAll('.on').forEach(b => {
				const i = +b.dataset.id;
				b.style.setProperty('--d', (Math.floor(i / 7) + i % 7) * 45 + 'ms');
			});
			confetti();
			setTimeout(winOpen, 1500);
		}

		function winOpen() {
			const win = $('#win');
			const board = $('#board');
			winBuild();
			win.hidden = false;
			const poses = winPose();
			board.classList.add('lifted');
			const runs = poses.map((p, i) => p.el.animate(
				[{ transform: p.from }, { transform: p.mid }, { transform: IDENT }],
				{ duration: 850, delay: i * 70, easing: 'cubic-bezier(.55,0,.2,1)', fill: 'both' }
			));
			win.classList.add('show');
			Promise.all(runs.map(a => a.finished)).then(() => {
				WIN.busy = false;
				$('#win-close').focus({ preventScroll: true });
			}).catch(() => {
				WIN.busy = false;
			});
		}

		// Close: the tiles fly back onto the board and the dialog fades away
		function winClose() {
			if (!WIN.open || WIN.busy) {
				return;
			}
			WIN.busy = true;
			$('#win').classList.remove('show');
			const poses = winPose();
			const runs = poses.map((p, i) => p.el.animate(
				[{ transform: IDENT }, { transform: p.mid }, { transform: p.from }],
				{ duration: 700, delay: i * 50, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'both' }
			));
			Promise.all(runs.map(a => a.finished)).then(winEnd).catch(winEnd);
		}

		function winEnd() {
			const board = $('#board');
			board.classList.remove('lifted', 'celebrating');
			$('#win').hidden = true;
			$('#win-grid').innerHTML = '';
			$('.app').inert = false;
			WIN.open = false;
			WIN.busy = false;
		}

		// ---- Events ----
		// Pointer-based drag and drop (mouse + touch). Ghost cells are drawn only on in-bounds cells, so nothing wraps across rows.
		const cellAt = (x, y) => {
			const el = document.elementFromPoint(x, y);
			const b = el && el.closest && el.closest('#board [data-id]');
			if (!b) {
				return null;
			}
			const i = +b.dataset.id;
			return [Math.floor(i / 7), i % 7];
		};

		function paintGhost() {
			document.querySelectorAll('#board .ok,#board .bad').forEach(e => e.classList.remove('ok', 'bad'));
			if (!S.hover || !S.sel) {
				return;
			}
			const fp = footprint(S.sel, S.hover[0], S.hover[1]);
			const good = fits(fp, occMap());
			fp.forEach(([r, c]) => {
				if (r < 0 || r > 6 || c < 0 || c > 6) {
					return;
				}
				const b = $('#board').children[r * 7 + c];
				if (b && b.dataset.id) {
					b.classList.add(good ? 'ok' : 'bad');
				}
			});
		}

		function makeFly(k) {
			const w = $('#board').children[0].offsetWidth;
			const step = w + 3;
			const sh = S.shape[k];
			const [a, b] = anchor(sh);
			const f = document.createElement('div');
			f.className = 'fly';
			f.innerHTML = sh.map(([x, y]) => `<i style="left:${y * step}px;top:${x * step}px;width:${w}px;height:${w}px;background:${COL[k]}"></i>`).join('');
			document.body.appendChild(f);
			drag.fly = f;
			drag.off = [b * step + w / 2, a * step + w / 2];
		}

		function moveFly() {
			const d = drag;
			d.fly.style.transform = `translate(${d.px - d.off[0]}px,${d.py - d.lift - d.off[1]}px)`;
		}

		function down(e, k, from, cell) {
			if ((e.button > 0) || drag) {
				return;
			}
			e.preventDefault();
			try {
				document.body.setPointerCapture(e.pointerId);
			} catch (_) {}
			drag = {
				k, from, cell,
				x0: e.clientX, y0: e.clientY,
				px: e.clientX, py: e.clientY,
				moved: false, started: false,
				lift: e.pointerType === 'mouse' ? 0 : 64,
				wasSel: S.sel === k
			};
			addEventListener('pointermove', move);
			addEventListener('pointerup', up);
			addEventListener('pointercancel', stop);
		}

		function move(e) {
			const d = drag;
			d.px = e.clientX;
			d.py = e.clientY;
			if (!d.started) {
				if (Math.hypot(d.px - d.x0, d.py - d.y0) < 8) {
					return;
				}
				d.moved = true;
				d.started = true;
				if (d.from == 'board') {
					delete S.placed[d.k];
				}
				S.sel = d.k;
				document.body.classList.add('dragging');
				msg('');
				render();
				makeFly(d.k);
			}
			moveFly();
			S.hover = cellAt(d.px, d.py - d.lift);
			paintGhost();
		}

		function end() {
			removeEventListener('pointermove', move);
			removeEventListener('pointerup', up);
			removeEventListener('pointercancel', stop);
			document.body.classList.remove('dragging');
			const d = drag;
			drag = null;
			if (d && d.fly) {
				d.fly.remove();
			}
			return d;
		}

		function stop() {
			const d = end();
			S.hover = null;
			if (d && d.started) {
				render();
			}
		}

		function up(e) {
			const d = drag;
			d.px = e.clientX;
			d.py = e.clientY;
			if (!d.started) {
				end();
				if (d.moved) {
					return;
				}
				if (d.from == 'tray') {
					S.sel = d.k;
					if (S.mode == 'free') {
						turn(cycle);
					} else {
						render();
					}
				}
				return;
			}
			const h = cellAt(d.px, d.py - d.lift);
			end();
			S.hover = null;
			if (h) {
				place(h[0], h[1]);
			} else {
				render();
			}
		}

		$('#tray').addEventListener('pointerdown', e => {
			const b = e.target.closest('[data-k]');
			if (b) {
				down(e, b.dataset.k, 'tray');
			}
		});

		$('#board').addEventListener('pointerdown', e => {
			const b = e.target.closest('[data-id]');
			if (!b) {
				return;
			}
			const i = +b.dataset.id;
			const k = occMap()[i];
			if (k) {
				if (S.placed[k].given) {
					return msg('That tile was a hint; it cannot be moved.');
				}
				down(e, k, 'board');
			}
		});

		$('#hint').onclick = hint;

		$('#win-close').onclick = winClose;

		document.addEventListener('keydown', e => {
			if (e.key == 'Escape') {
				winClose();
			}
		});

		$('#reset').onclick = () => {
			clear();
			msg('🧹 Board cleared.', 'clear');
			// After a solve the timer is frozen, so clearing the board starts a fresh attempt
			if (T.began && !T.id) {
				startTimer();
			}
		};

		document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
			S.mode = b.dataset.mode;
			if (S.mode == 'fixed') {
				snap();
			} else {
				for (const k of unplaced()) {
					S.shape[k] = norm(P[k]);
				}
			}
			msg('');
			render();
		});

		document.addEventListener('keydown', e => {
			if (e.target.tagName == 'INPUT') {
				return;
			}
			if (e.key == 'r' || e.key == 'R') {
				turn(cycle);
			}
			if (e.key == 'f' || e.key == 'F') {
				turn(flip);
			}
		});

		$('#dt').addEventListener('change', e => e.target.value && load(e.target.value));

		// "Let's Go!" hides the start screen, reveals the grid, and starts the timer
		$('#go').onclick = () => {
			$('#start').hidden = true;
			T.began = true;
			startTimer();
		};

		// ---- Startup ----
		const t = new Date();
		$('#dt').value = `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}`;
		load($('#dt').value);
		$('#go').focus();
		screen.orientation?.lock?.('portrait').catch(() => {});
	</script>
</body>
</html>
